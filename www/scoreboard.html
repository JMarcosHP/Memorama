<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover" />

  <!-- Icon -->
  <link rel="shortcut icon" href="img/ic_launcher-web.png" type="image/x-icon" />

  <!-- CSS only -->
  <link rel="stylesheet" href="bootstrap/css/bootstrap.css" />
  <link rel="stylesheet" href="css/index.css" />

  <!-- Font awesome icons -->
  <link rel="stylesheet" href="awesome-icons/css/all.css" />

  <title>Memorama</title>
</head>

<body class="index d-flex flex-column min-vh-100">
  <div class="collapse" id="navbarToggleExternalContent">
    <div class="bg-dark p-4">
      <h5 class="text-white h4">Collapsed content</h5>
      <span class="text-muted">Toggleable via the navbar brand.</span>
    </div>
  </div>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark text-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="scoreboard.html"><img src="img/memorama-transparent.png" alt="logo-memorama" width="25px" height="25px"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01" aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse nav-font" id="navbarColor01">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="login.html">Jugar</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" onclick="salirApp()">Salir de la app</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row">
      <div class="col-sm-12 col-md-12 col-lg-12">
        <table class="table table-bordered border-info text-center table-responsive table-striped mt-3">
          <thead class="table-dark table-thead-font">
            <tr>
              <th scope="col">#</th>
              <th scope="col">Usuario</th>
              <th scope="col">Tiempo</th>
              <th scope="col">Dificultad</th>
            </tr>
          </thead>
          <tbody class="table-tbody-font bg-light"  id="tabla">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-center mt-auto text-white border-top border-danger border-5">
    <!-- Grid container -->
    <div class="container p-4">
      <!-- Section: Redes Sociales. -->
      <section class="mb-4">
        <!-- Facebook -->
        <a class="btn btn-primary btn-floating m-1" style="background-color: #3b5998" href="https://www.facebook.com/MemoramaUTNA" role="button"><i class="fab fa-facebook"></i></a>

        <!-- Twitter -->
        <a class="btn btn-primary btn-floating m-1" style="background-color: #1E3050" href="https://twitter.com/memorama_utna" role="button"><i class="fab fa-x-twitter"></i></a>

        <!-- Correo -->
        <a class="btn btn-primary btn-floating m-1" style="background-color: #ff0000" 
          onclick="email()" role="button"><i class="fa-solid fa-envelope"></i>
        </a>

        <!-- Instagram -->
        <a class="btn btn-primary btn-floating m-1" style="background-color: #ac2bac" href="https://www.instagram.com/memoramautna/" role="button"><i class="fab fa-instagram"></i></a>

        <!-- Github -->
        <a class="btn btn-primary btn-floating m-1" style="background-color: #333333" href="  https://github.com/JMarcosHP/Memorama" role="button"><i class="fab fa-github"></i></a>
      </section>
      <!-- Section: Redes Sociales. -->

      <!-- Section: Creditos. -->
      <section class="">
        <!--Grid row-->
        <div class="row">
          <!--Grid column-->
          <div class="col-sm-12 col-md-12 col-lg-12 mb-4">
            <p class="text-center footer-font">v4.3</p>
            <h5 class="text-uppercase h-font mb-3">Desarrolladores:</h5>
            <ul class="list-unstyled mb-0 footer-font">
              <li>
                <p>Jehú Marcos Herrera Puentes</p>
              </li>
              <li>
                <p>Luis Alberto Díaz Monreal</p>
              </li>
            </ul>
          </div>
          <!--Grid column-->
        </div>
        <!--Grid row-->
      </section>
      <!-- Section: Links -->
    </div>
    <!-- Grid container -->

    <!-- Copyright -->
    <div class="text-center p-3 text-font" style="background-color: rgba(0, 0, 0, 0.2)">
    © 2024 Copyright: Techpower Solutions
    </div>
    <!-- Copyright -->
  </footer>
  <!-- Footer -->

  <!-- JavaScript Bundle with Popper -->
  <script src="cordova.js"></script>
  <script src="js/scoreboard.js"></script>
  <script src="bootstrap/js/bootstrap.bundle.js"></script>

</body>
</html>
