      <a class="navbar-brand" href="login.html"><img src="img/memorama-transparent.png" alt="logo-memorama" width="25px" height="25px"></a>
      <button class="navbar-toggler" type="submit" data-bs-toggle="collapse" data-bs-target="#navbarColor01"
        aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">

      </button>

          </li>
        </ul>

    </div>

  <br><br>

  <div class="container">
    <div class="row">
      <div class="col-sm-12">
        <div class="mx-4 p-4 my-4 bg-black bg-opacity-75 rounded rounded-4 border-light border-2">
          <h4 class="text-center text-light h-font">Ingresa tu nombre: </h4><br>
          <div class="container">
            <div class="row">
              <div class="col-sm-12"></div>
              <div class="col-12">
                <form action="javascript:void(0)">
                  <input type="text" id="nombre" name="nombre"
                    class="form-control pe-auto rounded rounded-4 text-center" required>
                </div>
              <div class="col"></div>
            </div>
          </div>
          <h5 class="mt-4 text-center text-light text-font">Selecciona el nivel de dificultad:</h5>

          <div class="mt-4 text-center">
            <button tabindex="-1" onclick="Facil()" class="facil pe-auto" type="submit">Fácil</button>
            <button tabindex="-1" onclick="Normal()" class="medio pe-auto" type="submit">Normal</button>
            <button tabindex="-1" onclick="Dificil()" class="dificil pe-auto" type="submit">Difícil</button>
            <button tabindex="-1" onclick="Extremo()" class="extremo pe-auto" type="submit">Extremo</button>
          </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  
  <div class="mt-5"></div>
  <br>
  <br>
  <br>

      <section class="mb-4">

        </a>

        <!-- Twitter -->
        <a class="btn btn-primary btn-floating m-1" style="background-color: #1E3050" href="https://twitter.com/memorama_utna"
        role="button"><i class="fab fa-x-twitter"></i>
        </a>

        <!-- Correo -->
        <a class="btn btn-primary btn-floating m-1" style="background-color: #ff0000" 
          onclick="email()" role="button"><i class="fa-solid fa-envelope"></i>
        </a>

        <!-- Instagram -->
        <a class="btn btn-primary btn-floating m-1" style="background-color: #ac2bac" href="https://www.instagram.com/memoramautna/"
        role="button"><i class="fab fa-instagram"></i>
        </a>

        <!-- Github -->
        <a class="btn btn-primary btn-floating m-1" style="background-color: #333333" href="https://github.com/JMarcosHP/Memorama"
        role="button"><i class="fab fa-github"></i>
        </a>

      <!-- Section: Redes Sociales. -->

      <section class="">

              </li>

              </li>
            </ul>
          </div>
          <!--Grid column-->
        </div>
        <!--Grid row-->
      </section>
